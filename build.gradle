plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
}

// --- Branch port/1.21.11: BBS 2.6 on MC 1.21.11 (Java 21) ---
// The 1.20.x targets live on master (-Pmc selector) and 1.21.1 on port/1.21.1. MC 1.21.11
// sits after the 1.21.5 RenderPipeline and 1.21.9 EntityRenderState rewrites, so shadow
// casters hand irl-core's raw-GL batch captured triangles instead of drawing into an Immediate.
def V = [
    minecraft: '1.21.11',
    yarn     : '1.21.11+build.6',
    fabricApi: '0.141.4+1.21.11',
    bbsJar   : 'libs/bbs-2.7-1.21.11.jar',
    sodium   : 'mc1.21.11-0.8.7-fabric',
    iris     : '1.10.7+1.21.11-fabric',
]
logger.lifecycle("IRLite build target: Minecraft ${V.minecraft} (yarn ${V.yarn})")

version = "${project.mod_version}+mc${V.minecraft}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "irlite" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            // Dev conveniences for automated runtime checks:
            //   -Pquickplay="World name"  auto-joins that singleplayer save,
            //   -PclientJvmArgs="-Dirlite.profileVl=true"  forwards JVM flags
            // (e.g. the VL/shadow profilers) into the forked client,
            //   -PrunDir=runs/1.21.11  keeps a per-version game dir apart from run/.
            if (project.hasProperty('runDir')) {
                runDir project.property('runDir').toString()
            }
            if (project.hasProperty('quickplay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickplay').toString()
            }
            if (project.hasProperty('clientJvmArgs')) {
                // Whitespace-separated; values containing spaces can't ride this.
                project.property('clientJvmArgs').toString().split(/\s+/).findAll { !it.isEmpty() }.each { vmArg it }
            }
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    // glsl-transformer (io.github.douira), an Iris runtime dependency.
    maven { url = "https://maven.gegy.dev/" }
    // irl-core (shared engine) is published here by `gradlew publishToMavenLocal`
    // in ../irl-core (branch 1.21.11) — must be resolvable before this mod builds.
    mavenLocal()
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${V.minecraft}"
    mappings "net.fabricmc:yarn:${V.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${V.fabricApi}"

    // Optional dev-client host override: -PbbsRuntimeJar=<path to another bbs-*.jar>.
    // Compilation stays on V.bbsJar (the audited compile axis); only runClient boots the given jar.
    def bbsRuntimeJar = project.findProperty('bbsRuntimeJar')?.toString()
    if (bbsRuntimeJar) {
        logger.lifecycle("IRLite dev runtime BBS override: ${bbsRuntimeJar}")
        modCompileOnly files(V.bbsJar)
        modLocalRuntime files(bbsRuntimeJar)
    } else {
        modImplementation files(V.bbsJar)
    }

    // --- Shared BBS-free engine: light SSBO + .irlights patcher (irl-core) ---
    // Per-version Loom module from mavenLocal (1.21.11 intermediary flavor): modClientImplementation
    // remaps it to this mod's named mappings; `include` bundles it (JiJ).
    modClientImplementation "org.qualet:irl-core:1.1.7"
    include "org.qualet:irl-core:1.1.7"

    // Iris is referenced at compile time (sampler mixins). Sodium 0.8.7 is the exact build
    // Iris 1.10.7 pins; runtime-only.
    modImplementation "maven.modrinth:iris:${V.iris}"
    modRuntimeOnly "maven.modrinth:sodium:${V.sodium}"

    // Iris runtime dependencies (not auto-pulled from the Modrinth artifact).
    // glsl-transformer 3.x additionally pulls antlr4-runtime at runtime.
    modRuntimeOnly "org.anarres:jcpp:1.4.14"
    modRuntimeOnly "io.github.douira:glsl-transformer:3.0.0-pre3"
    modRuntimeOnly "org.antlr:antlr4-runtime:4.13.1"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }

    // Embed the canonical .irlights (source of truth = patches/) so BbsPatcherHost
    // auto-extracts them on first use (matches the redactor's bundled model).
    from("patches") { into "assets/irlite/patches" }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
    it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Nested-jar hygiene: purge the include staging dir and the output jar up front so a
// bumped irl-core coordinate never ships alongside the stale one (see master for history).
tasks.named("processIncludeJars") {
    outputs.upToDateWhen { false }
    doFirst {
        delete fileTree(outputDirectory)
    }
}

tasks.named("remapJar") {
    outputs.upToDateWhen { false }
    doFirst {
        delete archiveFile
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
